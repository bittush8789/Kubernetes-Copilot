services:
  kubernetes-copilot:
    build: .
    container_name: kubernetes-copilot
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=False
      - CHROMA_PERSIST_DIRECTORY=/app/chroma_db
    volumes:
      - chroma_data:/app/chroma_db

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - kubernetes-copilot

volumes:
  chroma_data:
    driver: local
